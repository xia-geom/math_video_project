name: apply-p11-final-visual-fix

on:
  workflow_dispatch:
  push:
    branches: [fix-video-visual-p05-p20-2026-09]
    paths:
      - "tools/patch_p11_final_visual_transition.py"
      - ".github/workflows/apply-p11-final-visual-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-video-visual-p05-p20-2026-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/patch_p11_final_visual_transition.py
      - run: |
          git diff --check
          python -m py_compile scenes/fonctions_et_graphiques_fr/11_racines_et_hauteur_zero_fr/11_racines_et_hauteur_zero_fr_scene.py
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "xia-geom audit bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/fonctions_et_graphiques_fr/11_racines_et_hauteur_zero_fr/11_racines_et_hauteur_zero_fr_scene.py
          git commit -m "fix: clean P11 final summary transition"
          git push origin HEAD:fix-video-visual-p05-p20-2026-09
