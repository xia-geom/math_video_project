name: visual-audit-p27-followup

on:
  push:
    branches: [fix-video-visual-our-scope-2026-09]
    paths:
      - ".github/workflows/visual-audit-p27-followup.yml"
      - "tools/fix_p27_followup_visuals.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-video-visual-our-scope-2026-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/fix_p27_followup_visuals.py
      - run: python -m py_compile scenes/notations_fr/18_notation_sigma_fr/18_notation_sigma_fr_scene.py
      - name: Commit P27 follow-up fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/notations_fr/18_notation_sigma_fr/18_notation_sigma_fr_scene.py
          git commit -m "fix(video): replace remaining unsafe P27 formula morphs"
          git push origin HEAD:fix-video-visual-our-scope-2026-09

  render:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-video-visual-our-scope-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dvisvgm texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science libcairo2-dev libpango1.0-dev
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "manim>=0.18" "manim-voiceover[azure]>=0.3.7" numpy pandas xlrd "pyyaml>=6.0"
      - id: render_scene
        env:
          MANIM_DISABLE_VOICEOVER: "1"
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          evidence="audit_p27_followup"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source_commit.txt"
          set +e
          python -m manim -ql --disable_caching scenes/notations_fr/18_notation_sigma_fr/18_notation_sigma_fr_scene.py SigmaSommeBoucleFR > "$evidence/render.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$evidence/render_exit_code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then
            mp4="$(find media -type f -name 'SigmaSommeBoucleFR.mp4' -print -quit)"
            cp "$mp4" "$evidence/P27.mp4"
            ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json "$mp4" > "$evidence/ffprobe.json"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-p27-followup
          path: audit_p27_followup/
          retention-days: 7
      - if: always()
        shell: bash
        run: |
          status="${{ steps.render_scene.outputs.exit_code }}"; [[ -n "$status" ]] || status=99
          [[ "$status" == "0" ]] || exit "$status"
