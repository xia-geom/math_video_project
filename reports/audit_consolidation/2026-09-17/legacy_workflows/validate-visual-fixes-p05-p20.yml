name: validate-visual-fixes-p05-p20

on:
  workflow_dispatch:
  push:
    branches: [fix-video-visual-p05-p20-2026-09]
    paths:
      - ".github/workflows/validate-visual-fixes-p05-p20.yml"
      - "scenes/fonctions_et_graphiques_fr/05_modeles_affines_et_quadratiques_fr/**"
      - "scenes/fonctions_et_graphiques_fr/08_operations_sur_les_fonctions_fr/**"
      - "scenes/fonctions_et_graphiques_fr/10_fonction_reciproque_fr/**"
      - "scenes/fonctions_et_graphiques_fr/11_racines_et_hauteur_zero_fr/**"
      - "scenes/fonctions_et_graphiques_fr/12_multiplicite_des_racines_fr/**"
      - "scenes/probabilites_fr/15_principe_fondamental_du_denombrement_fr/**"
      - "scenes/probabilites_fr/16_permutation_arrangement_combinaison_fr/**"
      - "scenes/probabilites_fr/17_repetitions_en_denombrement_fr/**"
      - "scenes/vecteurs_fr/18_deplacement_et_composantes_fr/**"

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {id: P05, slug: modeles_affines_et_quadratiques, file: scenes/fonctions_et_graphiques_fr/05_modeles_affines_et_quadratiques_fr/05_modeles_affines_et_quadratiques_fr_scene.py, class: ModelesLineairesQuadratiques}
          - {id: P08, slug: operations_sur_les_fonctions, file: scenes/fonctions_et_graphiques_fr/08_operations_sur_les_fonctions_fr/08_operations_sur_les_fonctions_fr_scene.py, class: OperationsFonctionsFR}
          - {id: P10, slug: fonction_reciproque, file: scenes/fonctions_et_graphiques_fr/10_fonction_reciproque_fr/10_fonction_reciproque_fr_scene.py, class: FonctionReciproqueFR}
          - {id: P11, slug: racines_et_hauteur_zero, file: scenes/fonctions_et_graphiques_fr/11_racines_et_hauteur_zero_fr/11_racines_et_hauteur_zero_fr_scene.py, class: RacineHauteurZeroFR}
          - {id: P12, slug: multiplicite_des_racines, file: scenes/fonctions_et_graphiques_fr/12_multiplicite_des_racines_fr/12_multiplicite_des_racines_fr_scene.py, class: MultipliciteRacinesFR}
          - {id: P15, slug: principe_fondamental_du_denombrement, file: scenes/probabilites_fr/15_principe_fondamental_du_denombrement_fr/15_principe_fondamental_du_denombrement_fr_scene.py, class: PrincipeFondamentalDenombrementFR}
          - {id: P16, slug: permutation_arrangement_combinaison, file: scenes/probabilites_fr/16_permutation_arrangement_combinaison_fr/16_permutation_arrangement_combinaison_fr_scene.py, class: PermutationArrangementCombinaisonFR}
          - {id: P17, slug: repetitions_en_denombrement, file: scenes/probabilites_fr/17_repetitions_en_denombrement_fr/17_repetitions_en_denombrement_fr_scene.py, class: RepetitionsDenombrementFR}
          - {id: P18, slug: vecteurs_deplacement_et_composantes, file: scenes/vecteurs_fr/18_deplacement_et_composantes_fr/18_deplacement_et_composantes_fr_scene.py, class: VecteursDeplacementComposantesFR}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg dvisvgm \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science \
            libcairo2-dev libpango1.0-dev
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "manim>=0.18" "manim-voiceover[azure]>=0.3.7" numpy pandas xlrd "pyyaml>=6.0"
      - id: render_scene
        name: Re-render ${{ matrix.id }} after visual fix
        env:
          MANIM_DISABLE_VOICEOVER: "1"
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          evidence="audit_evidence/${{ matrix.id }}"
          mkdir -p "$evidence"
          printf '%s\n' \
            "id=${{ matrix.id }}" \
            "slug=${{ matrix.slug }}" \
            "scene_file=${{ matrix.file }}" \
            "scene_class=${{ matrix.class }}" \
            "commit=${GITHUB_SHA}" \
            > "$evidence/manifest.txt"
          set +e
          python -m manim -ql --disable_caching "${{ matrix.file }}" "${{ matrix.class }}" > "$evidence/render.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$evidence/render_exit_code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then
            mp4="$(find media -type f -name '${{ matrix.class }}.mp4' -print -quit)"
            if [[ -n "$mp4" && -f "$mp4" ]]; then
              cp "$mp4" "$evidence/${{ matrix.id }}_${{ matrix.slug }}.mp4"
              ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json "$mp4" > "$evidence/ffprobe.json"
            else
              echo "90" > "$evidence/render_exit_code.txt"
              echo "exit_code=90" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Upload re-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-fix-${{ matrix.id }}-${{ matrix.slug }}
          path: audit_evidence/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 7
      - name: Fail after evidence upload when render failed
        if: always()
        shell: bash
        run: |
          status="${{ steps.render_scene.outputs.exit_code }}"
          if [[ -z "$status" ]]; then status=99; fi
          if [[ "$status" != "0" ]]; then exit "$status"; fi
