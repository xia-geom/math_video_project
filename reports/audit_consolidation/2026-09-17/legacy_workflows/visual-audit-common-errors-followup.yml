name: visual-audit-common-errors-followup

on:
  push:
    branches: [fix-video-visual-our-scope-2026-09]
    paths:
      - ".github/workflows/visual-audit-common-errors-followup.yml"
      - "tools/fix_common_errors_followup_visuals.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-video-visual-our-scope-2026-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/fix_common_errors_followup_visuals.py
      - run: |
          python -m py_compile \
            scenes/erreurs_frequentes_fr/01_implication_et_equivalence_fr/01_implication_et_equivalence_fr_scene.py \
            scenes/erreurs_frequentes_fr/03_egalite_de_fonctions_fr/03_egalite_de_fonctions_fr_scene.py \
            scenes/erreurs_frequentes_fr/04_solutions_parasites_fr/04_solutions_parasites_fr_scene.py
      - name: Commit common-error follow-up fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/erreurs_frequentes_fr/01_implication_et_equivalence_fr/01_implication_et_equivalence_fr_scene.py \
                  scenes/erreurs_frequentes_fr/03_egalite_de_fonctions_fr/03_egalite_de_fonctions_fr_scene.py \
                  scenes/erreurs_frequentes_fr/04_solutions_parasites_fr/04_solutions_parasites_fr_scene.py
          git commit -m "fix(video): clean common-error visual layout defects"
          git push origin HEAD:fix-video-visual-our-scope-2026-09

  render:
    needs: apply
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: E01, slug: implication_et_equivalence, file: scenes/erreurs_frequentes_fr/01_implication_et_equivalence_fr/01_implication_et_equivalence_fr_scene.py, class: ImplicationEtEquivalenceFR}
          - {id: E03, slug: egalite_de_fonctions, file: scenes/erreurs_frequentes_fr/03_egalite_de_fonctions_fr/03_egalite_de_fonctions_fr_scene.py, class: EgaliteDeFonctionsFR}
          - {id: E04, slug: solutions_parasites, file: scenes/erreurs_frequentes_fr/04_solutions_parasites_fr/04_solutions_parasites_fr_scene.py, class: CarreEtSolutionsParasitesFR}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-video-visual-our-scope-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg dvisvgm texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science libcairo2-dev libpango1.0-dev
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "manim>=0.18" "manim-voiceover[azure]>=0.3.7" numpy pandas xlrd "pyyaml>=6.0"
      - id: render_scene
        env:
          MANIM_DISABLE_VOICEOVER: "1"
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          evidence="audit_common_errors_followup/${{ matrix.id }}"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source_commit.txt"
          set +e
          python -m manim -ql --disable_caching "${{ matrix.file }}" "${{ matrix.class }}" > "$evidence/render.log" 2>&1
          status=$?
          set -e
          echo "$status" > "$evidence/render_exit_code.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -eq 0 ]]; then
            mp4="$(find media -type f -name '${{ matrix.class }}.mp4' -print -quit)"
            cp "$mp4" "$evidence/${{ matrix.id }}.mp4"
            ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,r_frame_rate -of json "$mp4" > "$evidence/ffprobe.json"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-common-errors-followup-${{ matrix.id }}
          path: audit_common_errors_followup/${{ matrix.id }}/
          retention-days: 7
      - if: always()
        shell: bash
        run: |
          status="${{ steps.render_scene.outputs.exit_code }}"; [[ -n "$status" ]] || status=99
          [[ "$status" == "0" ]] || exit "$status"
