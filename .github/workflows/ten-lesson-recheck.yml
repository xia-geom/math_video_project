name: Ten lessons - containment and depth recheck

on:
  pull_request:
    branches: [main]
    paths:
      - 'scenes/**'
      - 'curriculum/worked_examples/**'
      - 'curriculum/practice_questions.yaml'
      - 'tools/lesson_practice.py'
      - 'tools/teaching_layout.py'
      - 'tests/test_practice*.py'
      - 'tools/expanded_teaching.py'
      - 'scripts/recheck_ten_lessons.py'
      - 'tests/test_expanded_teaching.py'
      - 'tests/test_worked_contexts.py'
      - '.github/workflows/ten-lesson-recheck.yml'
  workflow_dispatch:
    inputs:
      numbers:
        description: 'Optional global numbers; empty reviews all ten additions'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ten-lessons-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      MANIM_DISABLE_VOICEOVER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      REQUESTED_NUMBERS: ${{ inputs.numbers || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the established review runtime
        run: |
          mkdir -p review_artifacts/ten_lessons
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
          python -m pip install 'manim==0.19.0' 'manim-voiceover[azure]==0.3.7' 'python-dotenv==0.21.1' 'setuptools==80.9.0' pytest ruff pyyaml pandas xlrd
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          git rev-parse HEAD > review_artifacts/ten_lessons/tested_commit.txt
          python -m pip freeze > review_artifacts/ten_lessons/environment.txt
      - name: Verify current safety baseline and global catalogue
        run: |
          python scripts/check_private_data.py | tee review_artifacts/ten_lessons/privacy-index.json
          python scripts/check_private_history.py --revision HEAD | tee review_artifacts/ten_lessons/privacy-history.json
          python tools/course_catalog.py check
          python tools/course_catalog.py --write-indexes
          git diff --exit-code -- curriculum
      - name: Test new content, containment and existing course contracts
        run: |
          python -m pytest tests/test_practice_questions.py tests/test_practice_layout.py tests/test_worked_contexts.py tests/test_expanded_teaching.py tests/test_course_catalog.py tests/test_render_curriculum.py tests/test_syllabus_expansion.py tests/test_teaching_revision.py tests/test_tts.py tests/test_archive_renders.py tests/test_course_workflow_syntax.py tests/test_course_delivery_regressions.py tests/test_private_data_guard.py tests/test_public_audit.py tests/test_public_workflow_policy.py tests/test_course_timing.py tests/test_course_boundaries.py tests/test_course_visual_followup.py tests/test_history_cleanup.py tests/test_safety_finish.py tools/video_audit/tests -q --junitxml=review_artifacts/ten_lessons/tests.xml | tee review_artifacts/ten_lessons/tests.log
          ruff check --select E9,F63,F7,F82 scenes tools scripts/recheck_ten_lessons.py tests/test_expanded_teaching.py tests/test_worked_contexts.py tests/test_practice_questions.py tests/test_practice_layout.py
      - name: Record repository lint separately without weakening the existing lint workflow
        if: always()
        run: |
          ruff check . --output-format json > review_artifacts/ten_lessons/repository-ruff.json || test "$?" -eq 1
      - name: Render fresh 1080p60 reviews with per-update containment checks
        run: |
          python scripts/recheck_ten_lessons.py --quality qh --numbers "$REQUESTED_NUMBERS" --output review_artifacts/ten_lessons/rendered
      - name: Retain compact review evidence; no source Git writes or publication
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ten-lessons-${{ github.run_id }}
          path: |
            review_artifacts/ten_lessons/
            !review_artifacts/**/_media/**
          retention-days: 14
          if-no-files-found: error
