name: UQAM — ouvertures 20 s

on:
  pull_request:
    paths:
      - 'miscellaneous/bac_sciences_ouvertures_fr/**'
      - 'miscellaneous/uqam_promotion.json'
      - 'tests/test_uqam_ouvertures.py'
      - '.github/workflows/uqam-ouvertures.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Requested review output; silent preview is always built'
        required: true
        default: azure
        type: choice
        options: [silent, azure]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

concurrency:
  group: uqam-ouvertures-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}
      PROJECT: miscellaneous/bac_sciences_ouvertures_fr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: miscellaneous/bac_sciences_ouvertures_fr/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config fonts-dejavu-core
      - name: Install isolated short-clip runtime
        run: |
          python -m pip install -r "$PROJECT/requirements.txt" pytest ruff
          python -m pip check
      - name: Compile, lint and test contracts
        run: |
          mkdir -p review_artifacts/uqam_ouvertures
          git rev-parse HEAD > review_artifacts/uqam_ouvertures/tested_commit.txt
          python -m pip freeze > review_artifacts/uqam_ouvertures/environment.txt
          python -m compileall -q "$PROJECT" tests/test_uqam_ouvertures.py
          ruff check "$PROJECT" tests/test_uqam_ouvertures.py --output-format concise 2>&1 | tee review_artifacts/uqam_ouvertures/lint.log
          python -m pytest tests/test_uqam_ouvertures.py -q --junitxml=review_artifacts/uqam_ouvertures/tests.xml
      - name: Render and validate the 1080p silent preview
        run: python "$PROJECT/build.py" --mode silent --quality qh --output review_artifacts/uqam_ouvertures/silent
      - name: Record narration availability without exposing secrets
        id: speech
        env:
          SPEECH_KEY: ${{ secrets.SPEECH_KEY || secrets.AZURE_SUBSCRIPTION_KEY }}
          SPEECH_REGION: ${{ secrets.SPEECH_REGION || secrets.AZURE_SERVICE_REGION }}
          TRUSTED_SOURCE: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
          REQUESTED_MODE: ${{ inputs.mode || 'azure' }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('review_artifacts/uqam_ouvertures')
          requested = os.environ['REQUESTED_MODE'] == 'azure'
          trusted = os.environ['TRUSTED_SOURCE'] == 'true'
          has_key, has_region = bool(os.getenv('SPEECH_KEY')), bool(os.getenv('SPEECH_REGION'))
          available = requested and trusted and has_key and has_region
          reason = ('Narration not requested' if not requested else
                    'Untrusted pull-request source' if not trusted else
                    'Configured Speech key and/or region unavailable' if not available else None)
          status = {'status': 'ready' if available else ('blocked' if requested else 'not_requested'),
                    'reason': reason, 'requested': requested, 'trusted_source': trusted,
                    'key_present': has_key, 'region_present': has_region,
                    'listening_review': 'pending', 'release_ready': False}
          (root / 'narrated_status.json').write_text(json.dumps(status, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"available={'true' if available else 'false'}\n")
          print(json.dumps(status))
          PY
      - name: Render actual Azure narration in 1080p
        if: steps.speech.outputs.available == 'true'
        env:
          SPEECH_KEY: ${{ secrets.SPEECH_KEY || secrets.AZURE_SUBSCRIPTION_KEY }}
          SPEECH_REGION: ${{ secrets.SPEECH_REGION || secrets.AZURE_SERVICE_REGION }}
        run: |
          python "$PROJECT/build.py" --mode azure --quality qh --output review_artifacts/uqam_ouvertures/azure
          python - <<'PY'
          import json
          from pathlib import Path
          Path('review_artifacts/uqam_ouvertures/narrated_status.json').write_text(json.dumps({
              'status': 'rendered_for_review', 'listening_review': 'pending', 'release_ready': False
          }, indent=2) + '\n')
          PY
      - name: Explain the result in the job summary
        if: always()
        run: |
          echo '## UQAM — ouvertures interdisciplinaires' >> "$GITHUB_STEP_SUMMARY"
          echo 'The silent preview and actual Azure narration are separate outputs. No institutional publication is performed.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f review_artifacts/uqam_ouvertures/narrated_status.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat review_artifacts/uqam_ouvertures/narrated_status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload review evidence, including logs on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uqam-ouvertures-review-${{ github.run_id }}
          path: review_artifacts/uqam_ouvertures/
          retention-days: 30
          if-no-files-found: warn
