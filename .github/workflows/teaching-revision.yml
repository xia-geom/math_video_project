name: Teaching layout and voice review

on:
  pull_request:
    paths: ['scenes/**', 'tools/teaching*.py', 'tools/branding.py', 'tools/tts.py', 'scripts/teaching_revision/**', 'scripts/environment_lock.py', 'tests/test_teaching*.py', 'tests/test_environment_lock.py', 'requirements/**', 'pyproject.toml', '.github/workflows/teaching-revision.yml']
  workflow_dispatch:
    inputs:
      narrated_review:
        description: 'Explicitly request paid Azure narration from reviewed main'
        type: boolean
        default: false
        required: true
      numbers:
        description: 'Narrated review: global numbers or stable IDs; empty selects all catalogue entries'
        type: string
        default: '39,40'
        required: false

permissions:
  contents: read

concurrency:
  group: teaching-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  review:
    runs-on: ubuntu-24.04
    # Allows an explicitly selected full-course narrated batch; PR checks stay silent.
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      MANIM_DISABLE_VOICEOVER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
            requirements/locks/*.txt
      - name: Record exact tested source and snapshot, without fonts or generated media
        run: |
          mkdir -p review_artifacts/teaching
          git rev-parse HEAD > review_artifacts/teaching/tested_commit.txt
          python - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          roots=('scenes/','tools/','scripts/','tests/','curriculum/','docs/','requirements/','assets/branding/','.github/workflows/')
          top={'README.md','ARCHITECTURE.md','AGENTS.md','pyproject.toml','.gitignore'}
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('review_artifacts/teaching/teaching_source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p=Path(name)
                  if name and (name in top or name.startswith(roots)) and p.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.mp4','.wav','.mp3'} and p.is_file():
                      z.write(p,name)
          PY
      - name: Install established Manim review runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential patchelf ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/build-py313.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements/locks/teaching-py313-linux-x86_64.txt
          python -m pip check
          python -m pip freeze > review_artifacts/teaching/environment.txt
          python scripts/environment_lock.py inventory --output review_artifacts/teaching/environment.json
      - name: Record silent-review boundary without accessing credentials
        run: |
          printf '%s\n' '{"status":"not_requested","reason":"Narration requires explicit manual approval on main","listening":"not_performed"}' > review_artifacts/teaching/narration_availability.json
      - name: Test, audit construction states and render two real previews
        run: python scripts/teaching_revision/validate.py --output review_artifacts/teaching
      - name: Actual Azure review only when explicitly requested on main
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.narrated_review == true
        env:
          SPEECH_KEY: ${{ secrets.SPEECH_KEY || secrets.AZURE_SUBSCRIPTION_KEY }}
          SPEECH_REGION: ${{ secrets.SPEECH_REGION || secrets.AZURE_SERVICE_REGION }}
          REQUESTED_LESSONS: ${{ inputs.numbers }}
        run: |
          if [ -n "$SPEECH_KEY" ] && [ -n "$SPEECH_REGION" ]; then
            python scripts/course_audit.py --narration --skip-tests --jobs 1 --quality qh --numbers "$REQUESTED_LESSONS" --output review_artifacts/teaching/narrated
            printf '%s\n' '{"status":"rendered_for_review","listening":"pending","release_ready":false}' > review_artifacts/teaching/narration_availability.json
          else
            echo 'Azure narration blocked; no replacement voice or fake audio.'
            printf '%s\n' '{"status":"blocked","reason":"Missing configured Speech credentials","listening":"not_performed"}' > review_artifacts/teaching/narration_availability.json
          fi
      - name: Upload public review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: teaching-review-${{ github.run_id }}
          path: review_artifacts/teaching/
          retention-days: 14
          if-no-files-found: error
