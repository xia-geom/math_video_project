name: Teaching layout and voice review

on:
  pull_request:
    branches: [main]
    paths: ['scenes/**', 'tools/teaching*.py', 'scripts/teaching_revision/**', '.github/workflows/teaching-revision.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teaching-review-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/teaching-layout-voice-intro'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      MANIM_DISABLE_VOICEOVER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Correct the graph-to-caption contact found in visual inspection
        run: |
          mkdir -p review_artifacts/teaching_p12
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('scenes/fonctions_et_graphiques_fr/12_multiplicite_des_racines_fr/12_multiplicite_des_racines_fr_scene.py')
          s=p.read_text()
          changes=[('y_range=[-5, 4, 1],','y_range=[-4, 4, 1],'),('x_range=[-2.75, 2.35]','x_range=[-2.5, 2.35]'),('product_axes.c2p(-2, -5)','product_axes.c2p(-2, -4)'),('product_axes.c2p(1, -5)','product_axes.c2p(1, -4)')]
          for old,new in changes:
              if new not in s:
                  assert s.count(old)==1,old
                  s=s.replace(old,new)
          p.write_text(s)
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert not changed or changed==[str(p)],changed
          PY
          python -m compileall -q scenes/fonctions_et_graphiques_fr/12_multiplicite_des_racines_fr
          git diff --check
          if ! git diff --quiet; then
            git add -- scenes/fonctions_et_graphiques_fr/12_multiplicite_des_racines_fr
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(teaching): separate multiplicity graph from explanatory captions'
            git push origin HEAD:refs/heads/fix/teaching-layout-voice-intro
          fi
          git rev-parse HEAD > review_artifacts/teaching_p12/tested_commit.txt
          git diff HEAD^ HEAD -- > review_artifacts/teaching_p12/correction.diff
      - name: Install the established rendering environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
          python -m pip install 'manim==0.19.0' 'manim-voiceover[azure]==0.3.7' 'python-dotenv==0.21.1' 'setuptools==80.9.0' pytest ruff pyyaml
          python -m pip check
      - name: Recheck contracts and all construction states of the changed lesson
        run: |
          python -m pytest tests/test_tts.py tests/test_teaching_revision.py -q --junitxml=review_artifacts/teaching_p12/tests.xml | tee review_artifacts/teaching_p12/tests.log
          python scripts/teaching_revision/review.py --entry 11 --output review_artifacts/teaching_p12/layout
          cp scenes/fonctions_et_graphiques_fr/12_multiplicite_des_racines_fr/12_multiplicite_des_racines_fr_scene.py review_artifacts/teaching_p12/tested_scene.py
          python - <<'PY'
          import shutil
          shutil.rmtree('review_artifacts/teaching_p12/layout/_media',ignore_errors=True)
          PY
      - name: Upload targeted review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teaching-p12-review-${{ github.run_id }}
          path: review_artifacts/teaching_p12/
          retention-days: 14
          if-no-files-found: error
