name: Resume the requested course audit and restore reading pauses

on:
  push:
    branches: [feat/syllabus-expansion-audit-lessons]
    paths:
      - 'scripts/migrations/restore_reading_pauses.py'
      - 'tools/course_timing.py'
      - 'tests/test_course_timing.py'
      - '.github/workflows/course-timing-apply.yml'

permissions:
  contents: read

concurrency:
  group: course-timing-once
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  apply-and-review:
    if: github.event_name == 'push' && github.repository == 'xia-geom/math_video_project' && github.ref == 'refs/heads/feat/syllabus-expansion-audit-lessons'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      MANIM_DISABLE_VOICEOVER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the established review runtime
        run: |
          mkdir -p review_artifacts/course_timing
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
          python -m pip install 'manim==0.19.0' 'manim-voiceover[azure]==0.3.7' 'python-dotenv==0.21.1' 'setuptools==80.9.0' pytest ruff pyyaml pandas xlrd
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m pip freeze > review_artifacts/course_timing/environment.txt
      - name: Apply only the hash-checked reading-time follow-up
        run: |
          python scripts/migrations/restore_reading_pauses.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names=json.loads(Path('/tmp/course_timing_changed.json').read_text())
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git rm .github/workflows/course-timing-apply.yml scripts/migrations/restore_reading_pauses.py
          git diff --cached --check
          git diff --cached --stat > review_artifacts/course_timing/changes.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(course): preserve reading and reflection time across narrated lessons'
          git rev-parse HEAD > review_artifacts/course_timing/tested_commit.txt
      - name: Verify all course numbers and timing regressions
        run: |
          python tools/course_catalog.py check
          python tools/course_catalog.py --write-indexes
          git diff --exit-code -- curriculum
          python -m pytest tests/test_course_timing.py -q --junitxml=review_artifacts/course_timing/timing-tests.xml | tee review_artifacts/course_timing/timing-tests.log
          ruff check tools/course_timing.py tests/test_course_timing.py
      - name: Run full course contracts and rerender every affected lesson
        run: |
          python scripts/course_audit.py --numbers '03,04,15,20,21,22,24,25,26,27,28,29,30,32,33,34,37,39,40' --output review_artifacts/course_timing/audit
      - name: Push the exact tested source without force
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          actual="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote origin refs/heads/feat/syllabus-expansion-audit-lessons | cut -f1)"
          test "$actual" = "$EXPECTED_HEAD"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/syllabus-expansion-audit-lessons
          unset auth
      - name: Retain measured timing and encoded review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-timing-${{ github.run_id }}
          path: review_artifacts/course_timing/
          retention-days: 14
          if-no-files-found: error
