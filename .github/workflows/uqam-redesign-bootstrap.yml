name: UQAM redesign — review preparation
on:
  push:
    branches: [fix/uqam-two-films-redesign-20260930]
    paths: [.github/workflows/uqam-redesign-bootstrap.yml]
permissions:
  contents: read
jobs:
  lint-tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare lint wheels without changing any repository source
        run: python -m pip download -d review_wheels ruff==0.16.7 pytest==9.1.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uqam-lint-wheels
          path: review_wheels/
          retention-days: 3
