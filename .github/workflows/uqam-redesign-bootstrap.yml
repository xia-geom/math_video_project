name: UQAM redesign — review preparation
on:
  push:
    branches: [fix/uqam-two-films-redesign-20260930]
    paths: [.github/workflows/uqam-redesign-bootstrap.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare scoped source and candidate-image packet
        run: |
          mkdir -p review_packet/candidates
          python - <<'PY'
          import json, hashlib, subprocess, urllib.request, zipfile
          from pathlib import Path
          paths = ['AGENTS.md', 'AGENT.md', 'ARCHITECTURE.md', 'pyproject.toml', 'miscellaneous/README.md', 'miscellaneous/uqam_promotion.json', 'miscellaneous/bac_sciences_ouvertures_fr', 'miscellaneous/bac_math_uqam_fr', 'assets/uqam_promo', 'tests', 'tools', 'scripts/uqam_revision', '.github/workflows/uqam-ouvertures.yml', '.github/workflows/uqam-revision.yml', 'reports/uqam_video_revision/2026-09-30', 'reports/AUDIT_INDEX.md']
          names = subprocess.check_output(['git', 'ls-files', '-z', '--', *paths]).decode().split('\0')
          with zipfile.ZipFile('review_packet/scoped_source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  if name and Path(name).suffix.lower() not in {'.ttf', '.otf', '.woff', '.woff2', '.mp4', '.wav'}:
                      archive.write(name)
          urls = {
              'math_workshop_2019.jpg': 'https://actualites.uqam.ca/wp-content/uploads/2022/01/ateliers-scientifiques-4633-002.jpg',
              'student_welcome_2025.jpg': 'https://actualites.uqam.ca/wp-content/uploads/2025/09/accueil-etudiants-internationaux-5994.jpg',
              'montreal_skyline_2026.jpg': 'https://upload.wikimedia.org/wikipedia/commons/9/9f/Montreal%2C_Quebec_skyline.jpg',
          }
          status = {}
          for name, url in urls.items():
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'UQAM-video-editorial-review/1.0'})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = response.read()
                  Path('review_packet/candidates', name).write_bytes(data)
                  status[name] = {'url': url, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
              except Exception as error:
                  status[name] = {'url': url, 'error': str(error)}
          Path('review_packet/candidates/status.json').write_text(json.dumps(status, indent=2) + '\n')
          Path('review_packet/source_commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uqam-scoped-review-packet
          path: review_packet/
          retention-days: 3
  runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build isolated review wheels
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config
          python -m pip wheel -w review_wheels -r miscellaneous/bac_sciences_ouvertures_fr/requirements.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uqam-isolated-review-wheels
          path: review_wheels/
          retention-days: 3
