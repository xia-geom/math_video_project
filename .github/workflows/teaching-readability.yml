name: Teaching readability audit
on:
  pull_request:
    paths: ['.github/workflows/teaching-readability.yml', 'scripts/teaching_revision/deep*', 'tools/teaching_readability.py', 'tests/test_teaching_readability.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare native offline audit tooling, without fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dvisvgm
          mkdir -p review_artifacts/readability/tooling/lib
          cp /usr/bin/dvisvgm review_artifacts/readability/tooling/
          ldd /usr/bin/dvisvgm > review_artifacts/readability/tooling/ldd.txt
          awk '/=> \/.* \(/ { print $3 }' review_artifacts/readability/tooling/ldd.txt | while read -r lib; do cp -L "$lib" review_artifacts/readability/tooling/lib/; done
          git rev-parse HEAD > review_artifacts/readability/tested_commit.txt
          echo 'Tooling bootstrap only; not a scene validation.' > review_artifacts/readability/STATUS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: teaching-readability-${{ github.run_id }}
          path: review_artifacts/readability/
          retention-days: 7
          if-no-files-found: error
