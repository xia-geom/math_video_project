name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile-check every Python file
        run: |
          find scenes experiments tools archive -name '*.py' \
            -not -path '*/__pycache__/*' -print0 \
            | xargs -0 python -m py_compile

  render:
    runs-on: ubuntu-latest
    needs: [lint, compile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: scenes/geometrie_fr/12_pythagore_par_les_aires_fr/12_pythagore_par_les_aires_fr_scene.py
            class: PythagoreAireFR
          - file: scenes/fonctions_et_graphiques_fr/04_domaine_et_image_fr/04_domaine_et_image_fr_scene.py
            class: FonctionsDomaineImageFR
          - file: scenes/fonctions_et_graphiques_fr/06_modeles_affines_et_quadratiques_fr/06_modeles_affines_et_quadratiques_fr_scene.py
            class: ModelesLineairesQuadratiques
          - file: scenes/notations_fr/14_notation_sigma_fr/14_notation_sigma_fr_scene.py
            class: SigmaSommeBoucleFR
          - file: scenes/algebre_et_polynomes_fr/02_variables_et_polynomes_fr/02_variables_et_polynomes_fr_scene.py
            class: VariablesEtPolynomes
          - file: scenes/exponentielles_et_logarithmes_fr/11_logarithmes_fr/11_logarithmes_fr_scene.py
            class: Logarithme
          - file: scenes/trigonometrie_fr/13_du_cercle_au_sinus_fr/13_du_cercle_au_sinus_fr_scene.py
            class: SineCurveUnitCircle
          - file: scenes/algebre_et_polynomes_fr/07_completer_le_carre_fr/07_completer_le_carre_fr_scene.py
            class: CompleteTheSquare
          - file: scenes/fonctions_et_graphiques_fr/09_lire_les_proprietes_d_un_graphe_fr/09_lire_les_proprietes_d_un_graphe_fr_scene.py
            class: GraphProperties
          - file: scenes/geometrie_fr/circle_area/circle_area_scenes.py
            class: CircleAreaFR
          - file: scenes/erreurs_frequentes_fr/03_racine_d_un_produit_fr/03_racine_d_un_produit_fr_scene.py
            class: RacineProduitHypothesesFR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg texlive texlive-latex-extra texlive-fonts-extra \
            texlive-science libcairo2-dev libpango1.0-dev
      - name: Install project
        run: pip install -e .
      - name: Smoke render ${{ matrix.class }} (480p, no voice)
        run: manim -ql --disable_caching "${{ matrix.file }}" "${{ matrix.class }}"
