name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check .

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile-check every Python file
        run: |
          find scenes experiments tools archive -name '*.py' \
            -not -path '*/__pycache__/*' -print0 \
            | xargs -0 python -m py_compile

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml
      - id: catalog
        run: |
          python - <<'PYTHON'
          import json, os
          from tools.course_catalog import load_catalog
          _, entries = load_catalog()
          matrix = {"include": [{"file": e["scene_file"], "class": e["scene_class"]} for e in entries]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix) + "\n")
          PYTHON

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, compile, catalog]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg texlive texlive-latex-extra texlive-fonts-extra \
            texlive-science libcairo2-dev libpango1.0-dev
      - name: Install project
        run: pip install -e .
      - name: Smoke render ${{ matrix.class }} (480p, no voice)
        env:
          MANIM_DISABLE_VOICEOVER: '1'
        run: manim -ql --disable_caching "${{ matrix.file }}" "${{ matrix.class }}"
