name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/checks-py311.txt
      - run: ruff check .

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Compile-check every Python file
        run: |
          find scenes experiments tools archive -name '*.py' \
            -not -path '*/__pycache__/*' -print0 \
            | xargs -0 python -m py_compile

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      selected_count: ${{ steps.catalog.outputs.selected_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/checks-py311.txt
      - id: catalog
        run: |
          python scripts/select_affected_lessons.py --event-path "$GITHUB_EVENT_PATH" --output review_artifacts/affected-lessons.json
      - name: Test conservative render selection
        run: python -m pytest -q tests/test_affected_lessons.py

  render:
    if: needs.catalog.outputs.selected_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, compile, catalog]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential patchelf pkg-config ffmpeg texlive texlive-latex-extra texlive-fonts-extra \
            texlive-science libcairo2-dev libpango1.0-dev
      - name: Install project
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/build-py313.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements/locks/teaching-py313-linux-x86_64.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python scripts/environment_lock.py inventory --output review_artifacts/smoke/environment.json
      - name: Smoke render ${{ matrix.class }} (480p, no voice)
        env:
          MANIM_DISABLE_VOICEOVER: '1'
        run: manim -ql --disable_caching "${{ matrix.file }}" "${{ matrix.class }}"
