name: MAT0339 one-time import

on:
  push:
    branches: [book/mat0339-revision-2026-09-05]
    paths: ['.github/mat0339-import/payload.json.xz.b64']

permissions:
  contents: write

concurrency:
  group: mat0339-one-time-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'xia-geom/math_video_project' && github.ref == 'refs/heads/book/mat0339-revision-2026-09-05'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: book/mat0339-revision-2026-09-05
      - name: Import the hash-verified UTF-8 sources into the book directory only
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          folder = Path('.github/mat0339-import')
          expected = json.loads((folder / 'manifest.json').read_text())
          payload = base64.b64decode((folder / 'payload.json.xz.b64').read_bytes(), validate=True)
          assert hashlib.sha256(payload).hexdigest() == expected['payload_sha256']
          raw = lzma.decompress(payload, memlimit=256*1024*1024)
          assert len(raw) <= 5*1024*1024
          files = json.loads(raw)
          assert len(files) == expected['file_count']
          for name, contents in files.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith('books/mat0339/')
              assert isinstance(contents, str)
              destination = Path(name)
              data = contents.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == expected['files'][name]
              if destination.exists():
                  assert destination.read_bytes() == data, f'Existing divergent file: {name}'
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          print(f'Imported {len(files)} files; all SHA-256 checks passed.')
          PY
      - name: Verify archive preservation, section alignment and mathematics regressions
        run: make -C books/mat0339 verify
      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk poppler-utils texlive-latex-extra texlive-fonts-extra texlive-lang-french
      - name: Build and record the three dated PDFs
        run: make -C books/mat0339 release
      - name: Commit only the imported book and its requested PDF snapshots
        env:
          EXPECTED_BRANCH: book/mat0339-revision-2026-09-05
        run: |
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- books/mat0339
          git diff --cached --name-only | grep -q '^books/mat0339/'
          test -z "$(git diff --cached --name-only | grep -v '^books/mat0339/' || true)"
          git commit -m 'book: import revised MAT0339 manual, workbook, tests and dated PDFs'
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
