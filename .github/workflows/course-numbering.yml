name: Unified course numbering and deep audit

on:
  pull_request:
    branches: [main]
    paths: ['curriculum/**', 'scenes/**', 'tools/**', 'scripts/**', 'tests/**', '.github/workflows/**', 'pyproject.toml']
  push:
    branches: [feat/syllabus-expansion-audit-lessons]
    paths: ['curriculum/**', 'scenes/**', 'tools/**', 'scripts/**', 'tests/**', '.github/workflows/course-numbering.yml', 'pyproject.toml']
  workflow_dispatch:
    inputs:
      numbers:
        description: 'Global numbers or stable lesson IDs, separated by commas; empty audits all 43'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: course-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml pytest
      - name: Verify catalogue, generated indexes and delivery consumers without changing Git
        run: |
          python tools/course_catalog.py check
          python tools/course_catalog.py --write-indexes
          git diff --exit-code -- curriculum
          python scripts/render_syllabus_expansion.py --check-only
          python -m pytest tests/test_course_catalog.py tests/test_course_workflow_syntax.py tests/test_course_delivery_regressions.py tests/test_render_curriculum.py tools/video_audit/tests/test_render_script.py -q -k 'not narration'

  audit:
    needs: catalog
    # Full-course rendering is an explicit review, not repeated after every small edit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}
      MANIM_DISABLE_VOICEOVER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      REQUESTED_NUMBERS: ${{ inputs.numbers || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install and verify the established review runtime
        run: |
          mkdir -p review_artifacts/unified_course
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
          python -m pip install 'manim==0.19.0' 'manim-voiceover[azure]==0.3.7' 'python-dotenv==0.21.1' 'setuptools==80.9.0' pytest ruff pyyaml pandas xlrd
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m pip freeze > review_artifacts/unified_course/environment.txt
      - name: Test, construct and render the selected globally numbered lessons
        run: python scripts/course_audit.py --numbers "$REQUESTED_NUMBERS" --output review_artifacts/unified_course/audit
      - name: Retain tests, diagnostics and encoded review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unified-course-${{ github.run_id }}
          path: |
            review_artifacts/unified_course/
            !review_artifacts/**/*.ttf
            !review_artifacts/**/*.otf
            !review_artifacts/**/*.woff
            !review_artifacts/**/*.woff2
          retention-days: 14
          if-no-files-found: error
