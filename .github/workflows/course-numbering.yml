name: Unified course numbering and deep audit

on:
  pull_request:
    branches: [main]
    paths: ['curriculum/**', 'scenes/**', 'tools/**', 'scripts/**', 'tests/**', 'requirements/**', '.github/workflows/**', 'pyproject.toml', '.pre-commit-config.yaml']
  push:
    branches: [feat/syllabus-expansion-audit-lessons]
    paths: ['curriculum/**', 'scenes/**', 'tools/**', 'scripts/**', 'tests/**', 'requirements/**', '.github/workflows/course-numbering.yml', 'pyproject.toml', '.pre-commit-config.yaml']
  workflow_dispatch:
    inputs:
      numbers:
        description: 'Global numbers or stable lesson IDs, separated by commas; empty audits all catalogue entries'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: course-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements/locks/checks-py311.txt
      - name: Verify catalogue, generated indexes and delivery consumers without changing Git
        run: |
          python tools/course_catalog.py check
          python tools/course_catalog.py --check-indexes
          python scripts/render_syllabus_expansion.py --check-only
          python -m pytest tests/test_course_catalog.py tests/test_course_workflow_syntax.py tests/test_teaching_dependencies.py tests/test_environment_lock.py tests/test_course_delivery_regressions.py tests/test_render_curriculum.py tests/test_course_coherence_runner.py tests/test_course_source_snapshot.py tools/video_audit/tests/test_render_script.py -q -k 'not narration'
          python -m pytest tests/test_course_review.py tests/test_course_review_a.py tests/test_course_review_b.py tests/test_course_review_c.py tests/test_course_review_audio.py tests/test_course_review_scope_import.py tests/test_narration_provenance.py -q
          python -m pytest tests/test_course_evidence.py tests/test_listening_review.py tests/test_historical_utility_imports.py -q

  audit:
    needs: catalog
    # Full-course rendering is an explicit review, not repeated after every small edit.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      MANIM_DISABLE_VOICEOVER: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      REQUESTED_NUMBERS: ${{ inputs.numbers || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install and verify the established review runtime
        run: |
          mkdir -p review_artifacts/unified_course
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential patchelf ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
          python -m pip install --require-hashes --only-binary=:all: -r requirements/locks/build-py313.txt
          python -m pip install --require-hashes --no-build-isolation -r requirements/locks/teaching-py313-linux-x86_64.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python -m pip freeze > review_artifacts/unified_course/environment.txt
          python scripts/environment_lock.py inventory --output review_artifacts/unified_course/environment.json
      - name: Test, construct and render the selected globally numbered lessons
        run: python scripts/course_audit.py --numbers "$REQUESTED_NUMBERS" --jobs 2 --output review_artifacts/unified_course/audit
      - name: Reconcile evidence without claiming playback or listening
        if: always()
        run: python scripts/course_review.py --artifact-root review_artifacts/unified_course/audit --output review_artifacts/unified_course/current
      - name: Retain tests, diagnostics and encoded review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unified-course-${{ github.run_id }}
          path: |
            review_artifacts/unified_course/
            !review_artifacts/**/*.ttf
            !review_artifacts/**/*.otf
            !review_artifacts/**/*.woff
            !review_artifacts/**/*.woff2
          retention-days: 14
          if-no-files-found: error
