name: Audit integration

on:
  push:
    branches: [main, integration/audits-2026-09-17]
    paths:
      - '.github/workflows/audit-integration.yml'
      - 'scripts/audit_integration/**'
      - 'reports/**'
      - 'scenes/**'
      - 'miscellaneous/bac_math_uqam_fr/**'
      - 'miscellaneous/uqam-baccalaureat-mathematiques-cheminements/**'
      - 'tests/test_uqam*.py'
      - 'tools/tts.py'
      - 'tools/uqam_video_review.py'
  workflow_dispatch:

concurrency:
  group: audit-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      statuses: write
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
      LONG: miscellaneous/uqam-baccalaureat-mathematiques-cheminements
      EVIDENCE: review_artifacts/audit_integration
      MANIM_DISABLE_VOICEOVER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: miscellaneous/uqam-baccalaureat-mathematiques-cheminements/requirements.lock
      - name: Prepare ordered integration without changing main
        id: prepare
        if: github.ref == 'refs/heads/integration/audits-2026-09-17'
        run: |
          git config user.name 'Audit integration workflow'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$EVIDENCE"
          python scripts/audit_integration/consolidate.py --prepare 2>&1 | tee "$EVIDENCE/merge.log"
      - name: Record and verify exact merged source
        id: source
        run: |
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD | tee "$EVIDENCE/tested_commit.txt"
          python scripts/audit_integration/consolidate.py --verify 2>&1 | tee "$EVIDENCE/source_preservation.log"
          git log --oneline -12 > "$EVIDENCE/recent_commits.txt"
          git diff --stat 0c4556ab07e8ae700c1556148374a83c0808cef1 HEAD > "$EVIDENCE/merged_diff_stat.txt"
          python -m compileall -q scenes "$LONG" miscellaneous/bac_math_uqam_fr scripts/audit_integration tools/uqam_video_review.py
      - name: Install isolated test environments
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg sox libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
          python -m venv .venv-long
          .venv-long/bin/python -m pip install -r "$LONG/requirements.lock" 'pytest==9.1.1'
          python -m venv .venv-short
          grep -v '^python-dotenv==' "$LONG/requirements.lock" > /tmp/audit-shared-requirements.txt
          .venv-short/bin/python -m pip install -r /tmp/audit-shared-requirements.txt 'manim==0.19.0' 'manim-voiceover[azure]==0.3.7' 'python-dotenv==0.21.1' 'setuptools==80.9.0' 'pytest==9.1.1' 'ruff==0.16.7'
          .venv-short/bin/python -m pip check
          .venv-long/bin/python -m pip check
          .venv-short/bin/python -m pip freeze > "$EVIDENCE/short_environment.txt"
          .venv-long/bin/python -m pip freeze > "$EVIDENCE/long_environment.txt"
      - name: Focused correctness lint
        id: lint
        run: .venv-short/bin/ruff check --select E9,F63,F7,F82 scripts/audit_integration scenes "$LONG" miscellaneous/bac_math_uqam_fr tools/uqam_video_review.py
      - name: Short-film and revision regression tests
        id: short_tests
        continue-on-error: true
        run: .venv-short/bin/python -m pytest tests/test_uqam_promo.py tests/test_uqam_revision.py -q --junitxml="$EVIDENCE/short.xml" 2>&1 | tee "$EVIDENCE/short.log"
      - name: Long-film and historical regression tests
        id: long_tests
        continue-on-error: true
        run: .venv-long/bin/python -m pytest "$LONG/tests" -q --junitxml="$EVIDENCE/long.xml" 2>&1 | tee "$EVIDENCE/long.log"
      - name: Require both test suites
        if: always()
        run: |
          test '${{ steps.short_tests.outcome }}' = success
          test '${{ steps.long_tests.outcome }}' = success
          test '${{ steps.source.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
      - name: Save integration branch checkpoint only
        if: always() && github.ref == 'refs/heads/integration/audits-2026-09-17' && steps.prepare.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:refs/heads/integration/audits-2026-09-17
      - name: Record machine results on the tested commit
        if: always() && steps.source.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHORT_STATUS: ${{ steps.short_tests.outcome }}
          LONG_STATUS: ${{ steps.long_tests.outcome }}
          LINT_STATUS: ${{ steps.lint.outcome }}
        run: |
          sha=$(cat "$EVIDENCE/tested_commit.txt")
          state=failure
          if [ "$JOB_STATUS" = success ] && [ "$SHORT_STATUS" = success ] && [ "$LONG_STATUS" = success ] && [ "$LINT_STATUS" = success ]; then state=success; fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state="$state" -f context='Audit integration / source and regressions' -f description='Branch ancestry, exact source preservation, compile, lint and regression tests; not release approval' -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf 'Source: `%s`\n\nResult: %s\n\nNo narration or publication was performed.\n' "$sha" "$state" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-integration-${{ github.run_id }}
          path: review_artifacts/audit_integration/
          retention-days: 30
          if-no-files-found: warn
