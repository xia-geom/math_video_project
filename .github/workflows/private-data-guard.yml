name: Private data guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-data-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-data-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test prevention rules using invented fixtures
        run: python3 -m unittest discover -s tests -p 'test_private_data_guard.py' -v
      - name: Reject private reports and known private-data paths
        run: python3 scripts/check_private_data.py
