name: Private data guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-data-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-data-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test prevention rules using invented fixtures
        run: |
          python3 -m unittest discover -s tests -p 'test_private_data_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_safety_finish.py' -v
      - name: Reject private reports and known private-data paths
        run: python3 scripts/check_private_data.py
      - name: Reject reintroduced private-report history
        run: python3 scripts/check_private_history.py
