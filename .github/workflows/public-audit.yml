name: Public repository safeguards
on:
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/public_audit.py'
      - 'tests/test_public_audit.py'
      - 'SECURITY.md'
      - 'docs/PUBLIC_READINESS.md'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: public-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch public branches, tags and pull-request heads for history scan
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/pull/*'
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Run offline audit regressions
        run: python3 -m unittest discover -s tests -p 'test_public_audit.py' -v
      - name: Install checksum-verified Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
      - name: Scan reachable history, tracked files and bounded public GitHub surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/public_audit.py --gitleaks "$RUNNER_TEMP/gitleaks-bin/gitleaks" \
            --github-repository "$AUDIT_REPOSITORY" --output "$RUNNER_TEMP/public-audit-summary.json"
      - name: Retain only sanitized summary, never raw logs or secret matches
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-audit-summary
          path: ${{ runner.temp }}/public-audit-summary.json
          retention-days: 7
          if-no-files-found: warn
