name: Verify targeted history cleanup
on:
  pull_request:
    paths:
      - 'scripts/cleanup_billing_history.py'
      - 'scripts/cleanup_exposed_artifacts.py'
      - 'scripts/check_private_history.py'
      - 'scripts/enable_safety_settings.py'
      - 'tests/test_history_cleanup.py'
      - 'tests/test_safety_finish.py'
      - '.github/workflows/history-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: history-cleanup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned cleanup utility
        run: python -m pip install 'git-filter-repo==2.47.0'
      - name: Test isolated cleanup, pre-push detection and deletion matching
        run: |
          python -m unittest discover -s tests -p 'test_history_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_safety_finish.py' -v
      - name: Trial against fetched history without remote writes
        run: python scripts/cleanup_billing_history.py --output "$RUNNER_TEMP/history-trial"
      - name: Retain verification metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: history-cleanup-trial
          path: |
            ${{ runner.temp }}/history-trial/summary.json
            ${{ runner.temp }}/history-trial/commit-map.txt
            ${{ runner.temp }}/history-trial/support-request.md
          retention-days: 7
          if-no-files-found: warn
# The owner-approved one-time write job completed in run 35654203962 and was
