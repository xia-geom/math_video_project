name: UQAM revision

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "AGENTS.md"
      - "assets/uqam_promo/**"
      - "miscellaneous/bac_math_uqam_fr/**"
      - "tests/test_uqam_promo.py"
      - ".github/workflows/uqam-revision.yml"

concurrency:
  group: uqam-revision-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: write
    env:
      PYTHONPATH: ${{ github.workspace }}
      LONG: miscellaneous/uqam-baccalaureat-mathematiques-cheminements
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: miscellaneous/uqam-baccalaureat-mathematiques-cheminements/requirements.lock
      - name: Install render system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg sox poppler-utils libcairo2-dev libpango1.0-dev pkg-config texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
      - name: Install separate long-film and short-film environments
        run: |
          python -m venv .venv-long
          .venv-long/bin/python -m pip install -r "$LONG/requirements.lock" 'pytest==9.1.1'
          python -m venv .venv-short
          grep -v '^python-dotenv==' "$LONG/requirements.lock" > /tmp/uqam-shared-requirements.txt
          .venv-short/bin/python -m pip install -r /tmp/uqam-shared-requirements.txt 'manim==0.19.0' 'manim-voiceover[azure]==0.3.7' 'python-dotenv==0.21.1' 'setuptools==80.9.0' 'pytest==9.1.1' 'ruff==0.16.7'
          .venv-long/bin/python -m pip check
          .venv-short/bin/python -m pip check
          echo "$GITHUB_WORKSPACE/.venv-short/bin" >> "$GITHUB_PATH"
      - name: Refresh UQAM promotional photo assets
        run: .venv-short/bin/python miscellaneous/bac_math_uqam_fr/fetch_uqam_promo_assets.py
      - name: Record exact tested source revision
        run: |
          mkdir -p review_artifacts/uqam
          git rev-parse HEAD | tee review_artifacts/uqam/tested_commit.txt
          .venv-long/bin/python -m pip freeze > review_artifacts/uqam/long_test_environment.txt
          python -m pip freeze > review_artifacts/uqam/short_test_environment.txt
          test -f reports/uqam_video_revision/2026-09-14/implementation.json
      - name: Compile and focused correctness lint
        run: |
          python -m compileall -q "$LONG" miscellaneous/bac_math_uqam_fr tools/uqam_video_review.py scripts/uqam_revision tests/test_uqam_revision.py
          ruff check --select E9,F63,F7,F82 "$LONG" miscellaneous/bac_math_uqam_fr tools/uqam_video_review.py scripts/uqam_revision tests/test_uqam_revision.py
      - name: Execute short-film and new regression tests
        id: short_tests
        continue-on-error: true
        run: |
          python -m pytest tests/test_uqam_promo.py tests/test_uqam_revision.py -q --junitxml=review_artifacts/uqam/short_and_revision_tests.xml 2>&1 | tee review_artifacts/uqam/short_and_revision_tests.log
      - name: Execute all long-film regression suites including V2 and V3
        id: long_tests
        continue-on-error: true
        run: |
          .venv-long/bin/python -m pytest "$LONG/tests" -q --junitxml=review_artifacts/uqam/long_all_versions_tests.xml 2>&1 | tee review_artifacts/uqam/long_all_versions_tests.log
      - name: Require both regression suites to pass
        if: steps.short_tests.outcome != 'success' || steps.long_tests.outcome != 'success'
        run: exit 1
      - name: Encode visual-only review films and extract transition frames
        run: python scripts/uqam_revision/render_review.py 2>&1 | tee review_artifacts/uqam/render_review.log
      - name: Real narration and isolated narrated renders when credentials exist
        env:
          SPEECH_KEY: ${{ secrets.SPEECH_KEY || secrets.AZURE_SUBSCRIPTION_KEY }}
          SPEECH_REGION: ${{ secrets.SPEECH_REGION || secrets.AZURE_SERVICE_REGION }}
        run: |
          if [ -z "$SPEECH_KEY" ] || [ -z "$SPEECH_REGION" ]; then
            printf '%s\n' '{"status":"blocked","reason":"No configured Speech key/region available to this job","listening":"pending"}' > review_artifacts/uqam/narrated_status.json
            echo 'NARRATED_RENDER_BLOCKED: missing configured Speech credentials; no fallback voice was used.'
            exit 0
          fi
          .venv-long/bin/python "$LONG/render_v4.py" --artifact-tag "audit-${GITHUB_RUN_ID}" --tts azure
          set +e
          python miscellaneous/bac_math_uqam_fr/build_release.py
          status=$?
          set -e
          if [ "$status" != 0 ] && [ "$status" != 2 ]; then exit "$status"; fi
          printf '%s\n' '{"status":"rendered_for_review","raw_visual_inspection":"pending","full_listening":"pending","institutional_approval":"not inferred"}' > review_artifacts/uqam/narrated_status.json
      - name: Record machine result on the exact tested commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SHORT_STATUS: ${{ steps.short_tests.outcome }}
          LONG_STATUS: ${{ steps.long_tests.outcome }}
        run: |
          if [ ! -f review_artifacts/uqam/tested_commit.txt ]; then exit 0; fi
          sha=$(cat review_artifacts/uqam/tested_commit.txt)
          state=failure
          if [ "$JOB_STATUS" = success ] && [ "$SHORT_STATUS" = success ] && [ "$LONG_STATUS" = success ]; then
            if python -c 'import json; from pathlib import Path; p=Path("review_artifacts/uqam/STATUS.json"); assert p.is_file() and json.loads(p.read_text())["visual_only_render"] == "passed"'; then state=success; fi
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state="$state" -f context='UQAM revision / automated review' -f description='Tests and visual-only render only; consult narrated_status.json and human-review gates' -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uqam-revision-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            review_artifacts/uqam/
            reports/uqam_video_revision/2026-09-14/
            miscellaneous/uqam-baccalaureat-mathematiques-cheminements/dist/*audit*/
            dist/bac_math_uqam_fr/
